name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --project-name editor_automatico
      - name: Set Android SDK versions for native engines
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
      - name: Force compile SDK 36 for every Android module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kotlin = Path('android/build.gradle.kts')
          groovy = Path('android/build.gradle')

          if kotlin.exists():
              path = kotlin
              block = """
          // Keep Android library plugins aligned with the app compile SDK.
          subprojects {
              afterEvaluate {
                  val androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      val compileSdkMethod = androidExtension.javaClass.methods.firstOrNull {
                          (it.name == "compileSdkVersion" || it.name == "setCompileSdkVersion") &&
                          it.parameterCount == 1
                      }
                      compileSdkMethod?.invoke(androidExtension, 36)
                  }
              }
          }
          """
          elif groovy.exists():
              path = groovy
              block = """
          // Keep Android library plugins aligned with the app compile SDK.
          subprojects {
              afterEvaluate {
                  def androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      def compileSdkMethod = androidExtension.class.methods.find {
                          (it.name == "compileSdkVersion" || it.name == "setCompileSdkVersion") &&
                          it.parameterCount == 1
                      }
                      compileSdkMethod?.invoke(androidExtension, 36)
                  }
              }
          }
          """
          else:
              raise SystemExit("Generated Android root Gradle file not found")

          content = path.read_text()
          if "Keep Android library plugins aligned with the app compile SDK." not in content:
              path.write_text(content.rstrip() + "\\n\\n" + block + "\\n")
          PY
      - name: Configure network permission for first model download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', permission + '    <application', 1)
              path.write_text(content)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: editor-automatico-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
