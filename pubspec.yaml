name: editor_automatico
description: Editor automático de vídeos com processamento local.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  ffmpeg_kit_flutter_new_video: ^2.5.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  video_player: ^2.9.2
  whisper_cpp_flutter_plus: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
